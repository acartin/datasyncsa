<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="980" viewBox="0 0 1880 980">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 2; rx: 10; }
      .core { fill: #0f2740; stroke: #7dd3fc; stroke-width: 2.5; rx: 10; }
      .noteBox { fill: #1a2332; stroke: #475569; stroke-width: 1.5; rx: 8; }
      .txt { fill: #dbeafe; font: 700 18px monospace; text-anchor: middle; }
      .small { fill: #cbd5e1; font: 15px monospace; text-anchor: middle; }
      .left { fill: #cbd5e1; font: 15px monospace; }
      .title { fill: #f8fafc; font: 700 28px monospace; text-anchor: middle; }
      .subtitle { fill: #93c5fd; font: 16px monospace; text-anchor: middle; }
      .line { stroke: #334155; stroke-width: 2; }
      .arr { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .darr { stroke: #67e8f9; stroke-width: 2.5; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow2); }
      .label { fill: #bae6fd; font: 15px monospace; text-anchor: middle; }
      .muted { fill: #94a3b8; font: 14px monospace; text-anchor: middle; }
      .ok { fill: #86efac; font: 15px monospace; text-anchor: middle; }
      .warn { fill: #fcd34d; font: 15px monospace; text-anchor: middle; }
      .foot { fill: #94a3b8; font: 14px monospace; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1880" height="980"/>

  <text class="title" x="940" y="42">Flujo Canonico Actual del Chat</text>
  <text class="subtitle" x="940" y="72">Actualizado para inference-core-v3 | Estado real al 2026-03-07</text>

  <!-- Participants -->
  <rect class="panel" x="40" y="110" width="160" height="72"/>
  <text class="txt" x="120" y="153">Usuario</text>

  <rect class="panel" x="240" y="110" width="220" height="72"/>
  <text class="txt" x="350" y="145">chat-web-renderer</text>
  <text class="small" x="350" y="166">frontend widget</text>

  <rect class="panel" x="510" y="110" width="230" height="72"/>
  <text class="txt" x="625" y="145">chat-web-renderer</text>
  <text class="small" x="625" y="166">backend /chat</text>

  <rect class="panel" x="800" y="110" width="170" height="72"/>
  <text class="txt" x="885" y="145">Redis</text>
  <text class="small" x="885" y="166">session store</text>

  <rect class="core" x="1040" y="98" width="270" height="96"/>
  <text class="txt" x="1175" y="140">inference-core-v3</text>
  <text class="small" x="1175" y="162">agente soberano /api/v3/chat</text>
  <text class="small" x="1175" y="182">LangGraph runtime</text>

  <rect class="panel" x="1380" y="110" width="200" height="72"/>
  <text class="txt" x="1480" y="145">semantic-adapter-v2</text>
  <text class="small" x="1480" y="166">vector retrieval</text>

  <rect class="panel" x="1640" y="110" width="180" height="72"/>
  <text class="txt" x="1730" y="145">PostgreSQL</text>
  <text class="small" x="1730" y="166">lead data + jobs</text>

  <!-- Lifelines -->
  <line class="line" x1="120" y1="182" x2="120" y2="930"/>
  <line class="line" x1="350" y1="182" x2="350" y2="930"/>
  <line class="line" x1="625" y1="182" x2="625" y2="930"/>
  <line class="line" x1="885" y1="182" x2="885" y2="930"/>
  <line class="line" x1="1175" y1="194" x2="1175" y2="930"/>
  <line class="line" x1="1480" y1="182" x2="1480" y2="930"/>
  <line class="line" x1="1730" y1="182" x2="1730" y2="930"/>

  <!-- Step 1 -->
  <text class="left" x="60" y="230">1. El usuario escribe un mensaje</text>
  <line class="arr" x1="120" y1="255" x2="350" y2="255"/>
  <text class="label" x="235" y="244">input usuario</text>

  <!-- Step 2 -->
  <text class="left" x="60" y="300">2. El widget envia POST /chat al renderer API</text>
  <line class="arr" x1="350" y1="325" x2="625" y2="325"/>
  <text class="label" x="488" y="314">POST /chat</text>
  <text class="label" x="488" y="334">{client_id, channel, channel_user_id, message_text, metadata}</text>

  <!-- Step 3 -->
  <text class="left" x="60" y="370">3. El renderer carga sesion efimera por clave compuesta</text>
  <line class="arr" x1="625" y1="395" x2="885" y2="395"/>
  <text class="label" x="755" y="384">GET session</text>
  <text class="label" x="755" y="404">session:{client_id}:{channel}:{channel_user_id}</text>

  <line class="darr" x1="885" y1="435" x2="625" y2="435"/>
  <text class="label" x="755" y="424">{conversation_id, lead_id, session_context}</text>

  <!-- Step 4 -->
  <text class="left" x="60" y="485">4. El renderer reenvia el turno al agente soberano</text>
  <line class="arr" x1="625" y1="510" x2="1175" y2="510"/>
  <text class="label" x="900" y="499">POST /api/v3/chat</text>
  <text class="label" x="900" y="519">{queryText, clientId, conversationId, userMetadata(channel,...), filters}</text>

  <!-- Core internal graph -->
  <rect class="noteBox" x="1010" y="550" width="330" height="220"/>
  <text class="txt" x="1175" y="582">Root graph activo en v3</text>
  <text class="small" x="1175" y="612">hydrate_request -> load_tenant_runtime</text>
  <text class="small" x="1175" y="637">-> load_conversation_state -> merge_live_memory</text>
  <text class="small" x="1175" y="662">-> route_turn -> dispatch_vertical_subflow</text>
  <text class="small" x="1175" y="687">-> synthesize_final -> persist_final_turn</text>
  <text class="small" x="1175" y="712">-> enqueue_side_effects -> return_response</text>
  <text class="ok" x="1175" y="748">Subflujos activos: realtor_search, generic_answer, generic_rag</text>

  <!-- Step 5 optional retrieval -->
  <text class="left" x="60" y="565">5. Si aplica, el agente usa tools segun el subflujo</text>
  <line class="darr" x1="1175" y1="600" x2="1480" y2="600"/>
  <text class="label" x="1328" y="589">semantic_retrieval opcional</text>
  <text class="label" x="1328" y="609">(generic_rag / hybrid)</text>

  <line class="darr" x1="1480" y1="640" x2="1175" y2="640"/>
  <text class="label" x="1328" y="629">facts documentales</text>

  <!-- Step 6 persistence -->
  <text class="left" x="60" y="790">6. El core persiste la respuesta final real y encola side-effects</text>
  <line class="arr" x1="1175" y1="795" x2="1730" y2="795"/>
  <text class="label" x="1452" y="784">UPDATE/INSERT</text>
  <text class="label" x="1452" y="804">lead_conversations, context_snapshot, lead state, lead_scoring_jobs</text>

  <!-- Step 7 response back -->
  <text class="left" x="60" y="845">7. El core devuelve respuesta canonica; el renderer no piensa</text>
  <line class="darr" x1="1175" y1="850" x2="625" y2="850"/>
  <text class="label" x="900" y="839">{answer, components, intent, conversationId, leadId, scoringStatus}</text>

  <!-- Step 8 -->
  <line class="arr" x1="625" y1="890" x2="885" y2="890"/>
  <text class="label" x="755" y="879">UPSERT session</text>
  <text class="label" x="755" y="899">persist conversation_id + contexto efimero</text>

  <!-- Step 9 -->
  <line class="arr" x1="625" y1="930" x2="350" y2="930"/>
  <text class="label" x="488" y="919">SDUIResponse</text>
  <text class="label" x="488" y="939">{chat text + property-card/grid + branding}</text>

  <line class="arr" x1="350" y1="960" x2="120" y2="960"/>
  <text class="label" x="235" y="949">render final</text>

  <!-- Side notes -->
  <rect class="noteBox" x="1410" y="250" width="380" height="120"/>
  <text class="txt" x="1600" y="280">Entrada adicionales al mismo core</text>
  <text class="small" x="1600" y="310">generic-bridge-v2 -> /api/v3/chat</text>
  <text class="small" x="1600" y="335">property-bridge-v2 -> /api/v3/chat</text>
  <text class="warn" x="1600" y="360">Los bridges son wrappers finos, no orquestadores</text>

  <rect class="noteBox" x="1410" y="410" width="380" height="120"/>
  <text class="txt" x="1600" y="440">Estado de migracion</text>
  <text class="small" x="1600" y="470">v3 ya gobierna web + bridges</text>
  <text class="small" x="1600" y="495">workflow calendar/email/MCP sigue diferido</text>
  <text class="small" x="1600" y="520">v2 permanece como legado operativo, no como autoridad viva</text>

  <text class="foot" x="940" y="972">Referencia visual alineada con docs/CHAT_SYSTEM_REFERENCE.md y docs/INFERENCE_CORE_V3_BLUEPRINT.md</text>
</svg>
