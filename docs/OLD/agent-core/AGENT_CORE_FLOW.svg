      .line { stroke: #8e8e8e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .note-line { stroke: #666666; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .title { fill: #2f2f2f; font: 700 34px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .subtitle { fill: #5b5b5b; font: 400 24px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .smalltitle { fill: #111111; font: 700 30px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .smallsubtitle { fill: #125d4e; font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .llm-title { fill: #4d47b4; font: 700 34px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .llm-sub { fill: #5650bf; font: 400 24px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .gate-title { fill: #7a4a00; font: 700 34px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .gate-sub { fill: #925b0b; font: 400 24px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .ok-title { fill: #0d6353; font: 700 34px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .ok-sub { fill: #0f705d; font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .warn-title { fill: #8a2323; font: 700 32px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .warn-sub { fill: #a03f3f; font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .final-title { fill: #3f3f3f; font: 700 34px Arial, Helvetica, sans-serif; text-anchor: middle; }
      .caption { fill: #5e5e5e; font: 700 26px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1850"/>

  <rect class="panel" x="455" y="40" width="690" height="125" fill="#ddd9d0" stroke="#ddd9d0"/>
