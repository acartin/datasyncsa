  <text class="ok-sub" x="437" y="1050">query -> chunks</text>
  <text class="ok-sub" x="437" y="1084">+ evidence_ids</text>

  <rect class="panel" x="655" y="935" width="290" height="200" fill="#d7efe8" stroke="#67cbb4"/>
