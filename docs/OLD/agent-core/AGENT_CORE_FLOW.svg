<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1850" viewBox="0 0 1600 1850">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8e8e8e"/>
    </marker>
    <style>
      .bg { fill: #0b0b0b; }
      .panel { stroke-width: 3; rx: 22; ry: 22; }
