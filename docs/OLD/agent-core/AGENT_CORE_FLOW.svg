  <text class="ok-sub" x="800" y="1050">slots -> AST</text>
  <text class="ok-sub" x="800" y="1084">-> query segura</text>

  <rect class="panel" x="1025" y="935" width="275" height="200" fill="#d7efe8" stroke="#67cbb4"/>
