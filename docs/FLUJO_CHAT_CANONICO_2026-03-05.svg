<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <style>
      .bg { fill: #0f1117; }
      .box { fill: #171b23; stroke: #6c757d; stroke-width: 2; rx: 6; }
      .txt { fill: #d0ebff; font: 700 18px monospace; text-anchor: middle; }
      .line { stroke: #5c6773; stroke-width: 2; }
      .arr { stroke: #9ad1ff; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .darr { stroke: #9ad1ff; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .label { fill: #9ad1ff; font: 16px monospace; text-anchor: middle; }
      .note { fill: #ffd8a8; font: 16px monospace; }
      .ok { fill: #b2f2bb; font: 16px monospace; text-anchor: middle; }
      .foot { fill: #adb5bd; font: 14px monospace; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ad1ff" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="820"/>

  <!-- Participants -->
  <rect class="box" x="40" y="40" width="170" height="70"/><text class="txt" x="125" y="82">Usuario</text>
  <rect class="box" x="260" y="40" width="210" height="70"/><text class="txt" x="365" y="78">Frontend</text><text class="txt" x="365" y="98">(index.html)</text>
  <rect class="box" x="600" y="40" width="170" height="70"/><text class="txt" x="685" y="82">Bridge</text><text class="txt" x="685" y="102">(FastAPI)</text>
  <rect class="box" x="930" y="40" width="130" height="70"/><text class="txt" x="995" y="82">Redis</text>
  <rect class="box" x="1120" y="40" width="210" height="70"/><text class="txt" x="1225" y="78">Inference Core</text><text class="txt" x="1225" y="98">(:8091)</text>
  <rect class="box" x="1390" y="40" width="170" height="70"/><text class="txt" x="1475" y="82">PostgreSQL</text>

  <!-- Lifelines -->
  <line class="line" x1="125" y1="110" x2="125" y2="760"/>
  <line class="line" x1="365" y1="110" x2="365" y2="760"/>
  <line class="line" x1="685" y1="110" x2="685" y2="760"/>
  <line class="line" x1="995" y1="110" x2="995" y2="760"/>
  <line class="line" x1="1225" y1="110" x2="1225" y2="760"/>
  <line class="line" x1="1475" y1="110" x2="1475" y2="760"/>

  <!-- Sequence -->
  <text class="note" x="95" y="160">Escribe: "hola"</text>
  <line class="arr" x1="125" y1="185" x2="365" y2="185"/>
  <text class="label" x="245" y="175">input usuario</text>

  <line class="arr" x1="365" y1="240" x2="685" y2="240"/>
  <text class="label" x="525" y="220">POST /chat</text>
  <text class="label" x="525" y="240">{client_id, channel, channel_user_id, message_text, metadata?}</text>

  <line class="arr" x1="685" y1="300" x2="995" y2="300"/>
  <text class="label" x="840" y="280">GET session context</text>
  <text class="label" x="840" y="300">session:{client_id} o session:{client_id}:{channel}:{channel_user_id}</text>

  <line class="darr" x1="995" y1="350" x2="685" y2="350"/>
  <text class="label" x="840" y="340">{conversation_id, session_data}</text>

  <line class="arr" x1="685" y1="410" x2="1225" y2="410"/>
  <text class="label" x="955" y="390">POST /api/v2/chat</text>
  <text class="label" x="955" y="410">{queryText, clientId, conversationId, userMetadata}</text>

  <line class="arr" x1="1225" y1="465" x2="1475" y2="465"/>
  <text class="label" x="1350" y="455">SELECT/INSERT lead, conversación, scoring</text>

  <line class="darr" x1="1475" y1="505" x2="1225" y2="505"/>
  <text class="label" x="1350" y="495">resultado DB</text>

  <line class="darr" x1="1225" y1="545" x2="685" y2="545"/>
  <text class="label" x="955" y="535">{answer, sources, conversationId}</text>

  <line class="arr" x1="685" y1="590" x2="995" y2="590"/>
  <text class="label" x="840" y="580">UPDATE/UPSERT session (conversation_id)</text>

  <text class="ok" x="685" y="635">resolve vertical by client_id: real-estate -&gt; realtor, resto -&gt; generic/fallback</text>

  <line class="arr" x1="685" y1="680" x2="365" y2="680"/>
  <text class="label" x="525" y="670">SDUIResponse {components, branding, session_id}</text>

  <line class="arr" x1="365" y1="730" x2="125" y2="730"/>
  <text class="note" x="220" y="720">Renderiza respuesta</text>

  <text class="foot" x="800" y="790">Flujo canónico actual: /chat activo | /chat/v2 retirado | external v1 no expuesto</text>
</svg>
