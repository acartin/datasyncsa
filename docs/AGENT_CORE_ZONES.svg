<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <style>
      .bg { fill: #0b0b0b; }
      .col { stroke-width: 3; rx: 28; ry: 28; }
      .inner { stroke-width: 2.5; rx: 24; ry: 24; }
      .title { font: 700 38px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #3a3a3a; }
      .db { font: 700 30px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #5750cf; }
      .dbsub { font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #5d57ce; }
      .gate { font: 700 30px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #7a4a00; }
      .gatesub { font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #8d5a0c; }
      .run { font: 700 30px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #0b6252; }
      .runsub { font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #0f705d; }
      .plain { font: 700 30px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #444444; }
      .plainsub { font: 400 22px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #555555; }
      .footer { font: 700 26px Arial, Helvetica, sans-serif; text-anchor: middle; fill: #5e5e5e; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1180"/>

  <rect class="col" x="50" y="35" width="400" height="1110" fill="#ddd9d0" stroke="#ddd9d0"/>
  <rect class="col" x="500" y="35" width="400" height="1110" fill="#dddaf0" stroke="#6560e8"/>
  <rect class="col" x="950" y="35" width="420" height="1110" fill="#d7efe8" stroke="#67cbb4"/>
  <rect class="col" x="1420" y="35" width="330" height="1110" fill="#ddd9d0" stroke="#ddd9d0"/>

  <text class="title" x="250" y="110">base de datos</text>
  <text class="title" x="700" y="110">zona LLM</text>
  <text class="title" x="1160" y="110">runtime determin.</text>
  <text class="title" x="1585" y="110">contratos</text>

  <rect class="inner" x="95" y="170" width="310" height="145" fill="#f0eefb" stroke="#6560e8"/>
  <text class="db" x="250" y="236">planner prompts</text>
  <text class="dbsub" x="250" y="278">por tenant/vertical</text>

  <rect class="inner" x="95" y="340" width="310" height="145" fill="#edf4fd" stroke="#6aa5df"/>
  <text class="db" x="250" y="406">synth prompts</text>
  <text class="dbsub" x="250" y="448">tono · instrucciones</text>

  <rect class="inner" x="95" y="510" width="310" height="145" fill="#f4e8d8" stroke="#d29f45"/>
  <text class="gate" x="250" y="576">politicas gate</text>
  <text class="gatesub" x="250" y="618">tenant · permisos</text>

  <rect class="inner" x="95" y="680" width="310" height="145" fill="#e8f5f0" stroke="#67cbb4"/>
  <text class="run" x="250" y="746">tool registry</text>
  <text class="runsub" x="250" y="788">tools por tenant</text>

  <rect class="inner" x="95" y="850" width="310" height="145" fill="#f4f4f4" stroke="#9e9e9e"/>
  <text class="plain" x="250" y="916">card templates</text>
  <text class="plainsub" x="250" y="958">por vertical</text>

  <text class="footer" x="250" y="1088">estilo / politica versionable</text>
  <text class="footer" x="250" y="1122">por tenant</text>

  <rect class="inner" x="540" y="165" width="320" height="430" fill="#e8e7f7" stroke="#a79ff1" stroke-dasharray="10 8"/>
  <text class="plain" x="700" y="228">planner</text>
  <text class="plainsub" x="700" y="286">lee history</text>
  <text class="plainsub" x="700" y="326">lee context</text>
  <text class="plainsub" x="700" y="366">produce goal</text>
  <text class="plainsub" x="700" y="406">produce slots</text>
  <text class="plainsub" x="700" y="446">produce confidence</text>
  <text class="plainsub" x="700" y="506">NO ve ToolResult</text>

  <rect class="inner" x="540" y="640" width="320" height="300" fill="#e8e7f7" stroke="#a79ff1" stroke-dasharray="10 8"/>
  <text class="plain" x="700" y="706">synthesizer</text>
  <text class="plainsub" x="700" y="764">lee ToolResult</text>
  <text class="plainsub" x="700" y="804">lee context</text>
  <text class="plainsub" x="700" y="844">produce text</text>
  <text class="plainsub" x="700" y="884">NO decide goal</text>
  <text class="plainsub" x="700" y="924">NO ve RouterDecision</text>

  <text class="footer" x="700" y="1088">logica conversacional</text>
  <text class="footer" x="700" y="1122">probabilistica</text>

  <rect class="inner" x="995" y="165" width="330" height="170" fill="#e8f5f0" stroke="#67cbb4" stroke-dasharray="10 8"/>
  <text class="run" x="1160" y="228">policy gate</text>
  <text class="runsub" x="1160" y="274">accept / reject</text>
  <text class="runsub" x="1160" y="314">NUNCA modifica plan</text>

  <rect class="inner" x="995" y="380" width="330" height="250" fill="#e8f5f0" stroke="#67cbb4" stroke-dasharray="10 8"/>
  <text class="run" x="1160" y="444">SQL translator</text>
  <text class="runsub" x="1160" y="490">slots -> AST -> SQL</text>
  <text class="runsub" x="1160" y="530">allowlist tablas</text>
  <text class="runsub" x="1160" y="570">linter + row-limit</text>
  <text class="runsub" x="1160" y="610">NUNCA SQL libre</text>

  <rect class="inner" x="995" y="675" width="330" height="170" fill="#e8f5f0" stroke="#67cbb4" stroke-dasharray="10 8"/>
  <text class="run" x="1160" y="738">card_renderer</text>
  <text class="runsub" x="1160" y="784">ToolResult -> cards</text>
  <text class="runsub" x="1160" y="824">NUNCA pasa por LLM</text>

  <rect class="inner" x="995" y="890" width="330" height="170" fill="#e8f5f0" stroke="#67cbb4" stroke-dasharray="10 8"/>
  <text class="run" x="1160" y="953">answer guardrail</text>
  <text class="runsub" x="1160" y="999">accept / reject</text>
  <text class="runsub" x="1160" y="1039">NUNCA reescribe</text>

  <text class="footer" x="1160" y="1122">ejecucion 100% determinista</text>

  <rect class="inner" x="1460" y="175" width="250" height="105" fill="#f0eefb" stroke="#6560e8"/>
  <text class="db" x="1585" y="234">RouterDecision</text>
  <text class="dbsub" x="1585" y="265">Pydantic</text>

  <rect class="inner" x="1460" y="315" width="250" height="105" fill="#e8f5f0" stroke="#67cbb4"/>
  <text class="run" x="1585" y="374">ToolCall</text>
  <text class="runsub" x="1585" y="405">Pydantic</text>

  <rect class="inner" x="1460" y="455" width="250" height="105" fill="#e8f5f0" stroke="#67cbb4"/>
  <text class="run" x="1585" y="514">ToolResult</text>
  <text class="runsub" x="1585" y="545">Pydantic</text>

  <rect class="inner" x="1460" y="595" width="250" height="105" fill="#edf4fd" stroke="#6aa5df"/>
  <text class="db" x="1585" y="654">SynthInput</text>
  <text class="dbsub" x="1585" y="685">Pydantic</text>

  <rect class="inner" x="1460" y="735" width="250" height="105" fill="#f4e8d8" stroke="#d29f45"/>
  <text class="gate" x="1585" y="794">GateResult</text>
  <text class="gatesub" x="1585" y="825">Pydantic</text>

  <rect class="inner" x="1460" y="875" width="250" height="105" fill="#f4f4f4" stroke="#9e9e9e"/>
  <text class="plain" x="1585" y="934">CardModel</text>
  <text class="plainsub" x="1585" y="965">Pydantic</text>

  <rect class="inner" x="1460" y="1015" width="250" height="105" fill="#f4f4f4" stroke="#9e9e9e"/>
  <text class="plain" x="1585" y="1074">AnswerEnvelope</text>
  <text class="plainsub" x="1585" y="1105">Pydantic</text>
</svg>
