name: Publish DataSyncSA site image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-datasyncsa-site.yml
      - services/web/datasyncsa/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: services/web/datasyncsa
          file: services/web/datasyncsa/Dockerfile
          push: true
          tags: |
            ghcr.io/acartin/datasyncsa-site:main
            ghcr.io/acartin/datasyncsa-site:sha-${{ github.sha }}
