<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Test - DatasyncSA</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
    <div class="container test-container">
        <h1>💬 Chat Test</h1>
        <p class="subtitle"><a href="index.html">← Volver</a></p>

        <div class="input-group">
            <label for="clientId">Client ID (UUID)</label>
            <input type="text" id="clientId" value="64f357a0-98eb-44f1-9f41-6e615ed26180"
                placeholder="UUID del cliente">
        </div>

        <div class="input-group">
            <label for="message">Mensaje</label>
            <textarea id="message" rows="3"
                placeholder="Escribe tu pregunta aquí...">¿Cuáles son los requisitos de crédito?</textarea>
        </div>

        <div class="input-group">
            <label for="conversationId">Conversation ID (opcional)</label>
            <input type="text" id="conversationId" placeholder="Dejar vacío para nueva conversación">
        </div>

        <button id="sendBtn" onclick="sendMessage()">Enviar Mensaje</button>

        <div id="response" style="display:none;"></div>
    </div>

    <script>
        async function sendMessage() {
            const btn = document.getElementById('sendBtn');
            const responseDiv = document.getElementById('response');

            btn.disabled = true;
            btn.textContent = 'Enviando...';
            responseDiv.style.display = 'none';

            const payload = {
                queryText: document.getElementById('message').value,
                clientId: document.getElementById('clientId').value,
                conversationId: document.getElementById('conversationId').value || null
            };

            try {
                const response = await fetch('http://localhost:8083/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                responseDiv.className = response.ok ? 'response-box' : 'response-box error-box';
                responseDiv.innerHTML = `
                    <h3>${response.ok ? '✅ Respuesta' : '❌ Error'}</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    ${data.answer ? `<p><strong>Respuesta:</strong> ${data.answer}</p>` : ''}
                    ${data.conversationId ? `<p><strong>Conversation ID:</strong> ${data.conversationId}</p>` : ''}
                    ${data.sources ? `<p><strong>Fuentes:</strong> ${data.sources.length} documentos</p>` : ''}
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                responseDiv.style.display = 'block';

                if (data.conversationId) {
                    document.getElementById('conversationId').value = data.conversationId;
                }
            } catch (error) {
                responseDiv.className = 'response-box error-box';
                responseDiv.innerHTML = `
                    <h3>❌ Error de Red</h3>
                    <p>${error.message}</p>
                `;
                responseDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Mensaje';
            }
        }
    </script>
</body>

</html>
