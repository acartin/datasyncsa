<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Search Test - DatasyncSA</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
    <div class="container test-container">
        <h1>🔍 Semantic Search Test</h1>
        <p class="subtitle"><a href="index.html">← Volver</a></p>

        <div class="input-group">
            <label for="query">Query Text</label>
            <input type="text" id="query" value="políticas de crédito" placeholder="Texto a buscar">
        </div>

        <div class="input-group">
            <label for="clientId">Client ID</label>
            <input type="text" id="clientId" value="00000000-0000-0000-0000-000000000001">
        </div>

        <div class="input-group">
            <label for="topK">Top K Results</label>
            <input type="number" id="topK" value="3" min="1" max="10">
        </div>

        <button id="searchBtn" onclick="search()">Buscar</button>

        <div id="response" style="display:none;"></div>
    </div>

    <script>
        async function search() {
            const btn = document.getElementById('searchBtn');
            const responseDiv = document.getElementById('response');

            btn.disabled = true;
            btn.textContent = 'Buscando...';
            responseDiv.style.display = 'none';

            const payload = {
                query_text: document.getElementById('query').value,
                client_id: document.getElementById('clientId').value,
                top_k: parseInt(document.getElementById('topK').value)
            };

            try {
                const response = await fetch('http://localhost:8000/api/v1/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                responseDiv.className = response.ok ? 'response-box' : 'response-box error-box';
                responseDiv.innerHTML = `
                    <h3>${response.ok ? '✅ Resultados' : '❌ Error'}</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    ${data.results ? `<p><strong>Documentos encontrados:</strong> ${data.results.length}</p>` : ''}
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                responseDiv.style.display = 'block';
            } catch (error) {
                responseDiv.className = 'response-box error-box';
                responseDiv.innerHTML = `
                    <h3>❌ Error de Red</h3>
                    <p>${error.message}</p>
                `;
                responseDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Buscar';
            }
        }
    </script>
</body>

</html>
