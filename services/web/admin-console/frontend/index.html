<!DOCTYPE html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
    data-sidebar-image="none" data-preloader="disable" data-theme="default" data-theme-colors="default">

<head>
    <meta charset="utf-8" />
    <title>AI-Realtor - Web Interface</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="AI-Realtor Lead Manager" name="description" />
    <base href="/">
    <link rel="shortcut icon" href="/themes/images/favicon.ico">

    <!-- Layout config Js -->
    <!-- Sweet Alert css -->
    <link href="/themes/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />
    <!-- JSON Editor (for extraction_schema editing) -->
    <link href="/vendor/jsoneditor/jsoneditor.min.css" rel="stylesheet" type="text/css" />
    <!-- Bootstrap Css (Local) -->
    <link href="/themes/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <!-- Icons Css (Local) -->
    <link href="/themes/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css (Velzon Official) -->
    <link href="/themes/css/app.min.css" rel="stylesheet" type="text/css" />
    <!-- custom Css (Velzon Official) -->
    <link href="/themes/css/custom.min.css" rel="stylesheet" type="text/css" />
    <!-- Admin Console central override layer -->
    <link href="/themes/css/admin-console-overrides.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div id="layout-wrapper">
        <!-- Main Content -->
        <div class="main-content">
            <div class="page-content">
                <div class="container-fluid" id="app-root">
                    <!-- Dynamic Content will be rendered here -->
                    <div class="text-center mt-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Initializing AI-First Interface...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="/themes/js/bootstrap.bundle.min.js"></script>



    <!-- Core Renderer -->
    <script src="/themes/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="/vendor/jsoneditor/jsoneditor.min.js"></script>

    <script src="/config.js"></script>
    <script>
        // Simple Auth Guard
        if (!localStorage.getItem('access_token')) {
            window.location.href = '/login.html';
        }
    </script>
    <script>
        (function () {
            const version = (window.AppConfig && window.AppConfig.APP_VERSION) ? window.AppConfig.APP_VERSION : '1';
            const script = document.createElement('script');
            script.type = 'module';
            script.src = `/renderer/main.js?v=${encodeURIComponent(version)}`;
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>
