server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    client_max_body_size 100M;

    # Root directory mapped from host
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Proxy API routes to Backend API
    location ~ ^/(health|app-init|dashboard|leads|campaigns|ai-library|clients|countries|prompts|auth|users|roles|contacts|grid-presets|brand-config)(/|$) {
        proxy_pass http://prd-web-aifirst-api-01:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # SPA refresh support for direct route entry.
    # Without this, refreshing /ai-library may hit backend route proxy and return non-HTML responses.
    location = /ai-library {
        try_files /index.html =404;
    }

    location = /ai-library/ {
        try_files /index.html =404;
    }

    # Without this, refreshing /prompts may hit backend route proxy and return 401/JSON.
    location = /prompts {
        try_files /index.html =404;
    }

    location = /prompts/ {
        try_files /index.html =404;
    }

    # SPA Routing: Fallback to index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
