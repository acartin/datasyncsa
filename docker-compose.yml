services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE SERVICES
  # ---------------------------------------------------------------------------
  
  # Database (Replaces CT 101)
  postgres:
    build:
      context: ./services/database
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-infra-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network

  # Redis (Shared by Realtor Chat and ETL Queue)
  redis:
    image: redis:alpine
    container_name: ${ENV_PREFIX}-infra-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_network

  # Portainer (Container Management UI)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${ENV_PREFIX}-infra-portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "${PORTAINER_PORT}:9000"
    networks:
      - internal_network

  # ---------------------------------------------------------------------------
  # BACKEND SERVICES
  # ---------------------------------------------------------------------------
  # Inference Core V2
  inference-core-v2:
    build:
      context: ./services/inference-stack-v2/inference-core-v2
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-inference-v2
    restart: always
    ports:
      - "${INFERENCE_V2_PORT}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - RAG_RETRIEVER_V2_URL=http://semantic-adapter-v2:8000
      - RAG_RETRIEVER_V2_SEARCH_PATH=/api/v2/search
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # Semantic Adapter V2 (isolated runtime for v2 rollout)
  semantic-adapter-v2:
    build:
      context: ./services/inference-stack-v2/semantic-adapter-v2
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-semantic-v2
    restart: always
    ports:
      - "${SEMANTIC_V2_PORT}:8000"
    env_file:
      - .env
    environment:
      - INFERENCE_CORE_URL=http://inference-core-v2:8000
      - DATABASE_URL=${DATABASE_URL}
      - TABLE_VECTORS=${TABLE_VECTORS}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - inference-core-v2
    networks:
      - internal_network

  # ETL Docs API
  etl-docs:
    build:
      context: ./services/etl-docs
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-etl-docs
    restart: always
    ports:
      - "${ETL_DOCS_PORT}:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - REDIS_URL=redis://redis:6379/0
      - PATH_STAGING=/app/data/staging
      - PATH_STORAGE=/app/data/storage
      - MEMORY_RESET_URL=http://realtor-api:8000/internal/memory/reset
      - MEMORY_RESET_TIMEOUT=8
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ${HOST_PATH_STAGING}:/app/data/staging
      - ${HOST_PATH_STORAGE}:/app/data/storage
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # ETL Docs Worker (RQ)
  etl-docs-worker:
    build:
      context: ./services/etl-docs
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-etl-docs-worker
    restart: always
    command: ["rq", "worker", "docs", "--url", "redis://redis:6379/0"]
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - REDIS_URL=redis://redis:6379/0
      - PATH_STAGING=/app/data/staging
      - PATH_STORAGE=/app/data/storage
      - MEMORY_RESET_URL=http://realtor-api:8000/internal/memory/reset
      - MEMORY_RESET_TIMEOUT=8
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ${HOST_PATH_STAGING}:/app/data/staging
      - ${HOST_PATH_STORAGE}:/app/data/storage
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # ---------------------------------------------------------------------------
  # WEB SERVICES (Frontend + BFF)
  # ---------------------------------------------------------------------------

  # Admin Console API (BFF) - Renamed from AiFirst
  admin-console-api:
    build:
      context: ./services/web/admin-console/backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPS: "true"
    container_name: ${ENV_PREFIX}-web-admin-console-api
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_API_PORT}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - ETL_SERVICE_URL=${ETL_SERVICE_URL} # External URL
      - INFERENCE_CORE_URL=http://inference-core-v2:8000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - internal_network

  # Admin Console Frontend (Nginx) - Renamed from AiFirst
  admin-console-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-admin-console-ui
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_WEB_PORT}:80"
    volumes:
      - ./services/web/admin-console/frontend:/usr/share/nginx/html:ro
      - ./services/web/admin-console/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - API_HOST=${ENV_PREFIX}-web-admin-console-api
      - APP_VERSION=${APP_VERSION}
    depends_on:
      - admin-console-api
    networks:
      - internal_network

  # Realtor Chat API (Bridge)
  realtor-api:
    build:
      context: ./services/web/realtor-chat/backend
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-web-realtor-chat-api
    restart: unless-stopped
    ports:
      - "${REALTOR_BRIDGE_PORT}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_DATABASE=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_USERNAME=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PASSWORD=${DB_PASS}
      - REDIS_URL=redis://redis:6379/0
      - INFERENCE_V2_URL=http://inference-core-v2:8000
      - INFERENCE_V2_RESET_URL=http://inference-core-v2:8000/api/v2/internal/memory/reset
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
      - inference-core-v2
    networks:
      - internal_network

  # Generic Bridge V2
  generic-bridge-v2:
    build:
      context: ./services/generic-bridge-v2
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-web-generic-bridge-v2
    restart: unless-stopped
    ports:
      - "${GENERIC_BRIDGE_V2_PORT}:8000"
    environment:
      - INFERENCE_V2_URL=http://inference-core-v2:8000
      - INFERENCE_V2_API_PREFIX=/api/v2
      - REQUEST_TIMEOUT=30
      - MAX_RETRIES=3
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - inference-core-v2
    networks:
      - internal_network

  # Realtor Bridge V2
  realtor-bridge-v2:
    build:
      context: ./services/realtor-bridge-v2
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-web-realtor-bridge-v2
    restart: unless-stopped
    ports:
      - "${REALTOR_BRIDGE_V2_PORT}:8000"
    environment:
      - INFERENCE_V2_URL=http://inference-core-v2:8000
      - INFERENCE_V2_API_PREFIX=/api/v2
      - REQUEST_TIMEOUT=30
      - MAX_RETRIES=3
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - inference-core-v2
    networks:
      - internal_network

  # Realtor Chat Frontend (Nginx)
  realtor-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-realtor-chat-ui
    restart: unless-stopped
    ports:
      - "${REALTOR_WEB_PORT}:80"
    volumes:
      - ./services/web/realtor-chat/frontend:/usr/share/nginx/html:ro
      - ./services/web/realtor-chat/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - API_HOST=realtor-api
    depends_on:
      - realtor-api
    networks:
      - internal_network

  # Corporate Website (Static)
  datasyncsa-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-corporate
    restart: unless-stopped
    ports:
      - "${CORPORATE_WEB_PORT}:80"
    volumes:
      - ./services/web/datasyncsa:/usr/share/nginx/html:ro
    networks:
      - internal_network

  # Test UI (Development Only)
  test-ui:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-test-ui
    restart: unless-stopped
    ports:
      - "${TEST_UI_PORT}:80"
    volumes:
      - ./services/web/tests:/usr/share/nginx/html:ro
    networks:
      - internal_network

# ---------------------------------------------------------------------------
# NETWORKS & VOLUMES
# ---------------------------------------------------------------------------
networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  portainer_data:
