services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE SERVICES
  # ---------------------------------------------------------------------------
  
  # Database (Replaces CT 101)
  postgres:
    build:
      context: ./services/database
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-infra-postgres
    restart: always
    command: ["postgres", "-c", "timezone=${TZ:-UTC}"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ:-UTC}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network

  # Redis (Shared by Chat Web Renderer and ETL Queue)
  redis:
    image: redis:alpine
    container_name: ${ENV_PREFIX}-infra-redis
    restart: always
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - redis_data:/data
    networks:
      - internal_network

  # Portainer (Container Management UI)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${ENV_PREFIX}-infra-portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "${PORTAINER_PORT}:9000"
    environment:
      TZ: ${TZ:-UTC}
    networks:
      - internal_network

  # ---------------------------------------------------------------------------
  # BACKEND SERVICES
  # ---------------------------------------------------------------------------
  # AI Runtime (LangGraph multitenant assistant)
  ai-runtime:
    build:
      context: .
      dockerfile: ./services/ai_runtime/Dockerfile
    container_name: ${ENV_PREFIX}-backend-ai-runtime
    restart: always
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${AI_RUNTIME_WEB_CONCURRENCY:-1}
    ports:
      - "${AI_RUNTIME_PORT:-8096}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TZ=${TZ:-UTC}
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - AI_RUNTIME_API_PREFIX=/api/v1
      - PYTHONPATH=/app
    volumes:
      - ./schemas:/app/schemas:ro
      - ./log:/app/log
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # Scoring Core API (async scoring domain service)
  scoring-core:
    build:
      context: ./services/scoring-core
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-scoring-core
    restart: always
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - ${SCORING_CORE_WEB_CONCURRENCY:-1}
    ports:
      - "${SCORING_CORE_PORT:-8097}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TZ=${TZ:-UTC}
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TIMEOUT_SECS=${LLM_TIMEOUT_SECS}
      - SCORING_API_PREFIX=${SCORING_API_PREFIX:-/api/v1}
      - SCORING_LLM_TIMEOUT_SECS=${SCORING_LLM_TIMEOUT_SECS:-60}
      - SCORING_LLM_HARD_TIMEOUT_SECS=${SCORING_LLM_HARD_TIMEOUT_SECS:-10}
      - SCORING_LLM_MAX_OUTPUT_TOKENS=${SCORING_LLM_MAX_OUTPUT_TOKENS:-512}
      - SCORING_JOB_DEBOUNCE_SECS=${SCORING_JOB_DEBOUNCE_SECS:-1.5}
      - SCORING_WORKER_POLL_SECS=${SCORING_WORKER_POLL_SECS:-2.0}
      - SCORING_WORKER_CONCURRENCY=${SCORING_WORKER_CONCURRENCY:-1}
      - SCORING_JOB_MAX_ATTEMPTS=${SCORING_JOB_MAX_ATTEMPTS:-3}
      - SCORING_JOB_LOCK_TTL_SECS=${SCORING_JOB_LOCK_TTL_SECS:-120}
      - SCORING_RETRY_DELAY_SECS=${SCORING_RETRY_DELAY_SECS:-5}
      - SCORING_ALLOW_HEURISTIC_FALLBACK=${SCORING_ALLOW_HEURISTIC_FALLBACK:-false}
      - LLM_TRACE_ROOT=/app/log
      - LLM_TRACE_ENABLED=true
    volumes:
      - ./schemas:/app/schemas:ro
      - ./log:/app/log
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # Scoring Core async worker
  scoring-core-worker:
    build:
      context: ./services/scoring-core
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-scoring-core-worker
    restart: always
    command: ["python", "worker.py"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TZ=${TZ:-UTC}
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TIMEOUT_SECS=${LLM_TIMEOUT_SECS}
      - SCORING_API_PREFIX=${SCORING_API_PREFIX:-/api/v1}
      - SCORING_LLM_TIMEOUT_SECS=${SCORING_LLM_TIMEOUT_SECS:-60}
      - SCORING_LLM_HARD_TIMEOUT_SECS=${SCORING_LLM_HARD_TIMEOUT_SECS:-10}
      - SCORING_LLM_MAX_OUTPUT_TOKENS=${SCORING_LLM_MAX_OUTPUT_TOKENS:-512}
      - SCORING_JOB_DEBOUNCE_SECS=${SCORING_JOB_DEBOUNCE_SECS:-1.5}
      - SCORING_WORKER_POLL_SECS=${SCORING_WORKER_POLL_SECS:-2.0}
      - SCORING_WORKER_CONCURRENCY=${SCORING_WORKER_CONCURRENCY:-1}
      - SCORING_JOB_MAX_ATTEMPTS=${SCORING_JOB_MAX_ATTEMPTS:-3}
      - SCORING_JOB_LOCK_TTL_SECS=${SCORING_JOB_LOCK_TTL_SECS:-120}
      - SCORING_RETRY_DELAY_SECS=${SCORING_RETRY_DELAY_SECS:-5}
      - SCORING_ALLOW_HEURISTIC_FALLBACK=${SCORING_ALLOW_HEURISTIC_FALLBACK:-false}
      - LLM_TRACE_ROOT=/app/log
      - LLM_TRACE_ENABLED=true
    volumes:
      - ./schemas:/app/schemas:ro
      - ./log:/app/log
    depends_on:
      - postgres
      - redis
      - scoring-core
    networks:
      - internal_network

  # ETL Docs API
  etl-docs:
    build:
      context: ./services/etl-docs
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-etl-docs
    restart: always
    ports:
      - "${ETL_DOCS_PORT}:8000"
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - REDIS_URL=redis://redis:6379/0
      - PATH_STAGING=/app/data/staging
      - PATH_STORAGE=/app/data/storage
      - MEMORY_RESET_URL=http://chat-web-renderer-api:8000/internal/memory/reset
      - MEMORY_RESET_TIMEOUT=8
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ${HOST_PATH_STAGING}:/app/data/staging
      - ${HOST_PATH_STORAGE}:/app/data/storage
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # ETL Docs Worker (RQ)
  etl-docs-worker:
    build:
      context: ./services/etl-docs
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-etl-docs-worker
    restart: always
    command: ["rq", "worker", "docs", "--url", "redis://redis:6379/0"]
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - REDIS_URL=redis://redis:6379/0
      - PATH_STAGING=/app/data/staging
      - PATH_STORAGE=/app/data/storage
      - MEMORY_RESET_URL=http://chat-web-renderer-api:8000/internal/memory/reset
      - MEMORY_RESET_TIMEOUT=8
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ${HOST_PATH_STAGING}:/app/data/staging
      - ${HOST_PATH_STORAGE}:/app/data/storage
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # ---------------------------------------------------------------------------
  # WEB SERVICES (Frontend + BFF)
  # ---------------------------------------------------------------------------

  # Admin Console API (BFF) - Renamed from AiFirst
  admin-console-api:
    build:
      context: ./services/web/admin-console/backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPS: "true"
    container_name: ${ENV_PREFIX}-web-admin-console-api
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_API_PORT}:8000"
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=postgres
      - DB_PORT=5432
      - ETL_SERVICE_URL=${ETL_SERVICE_URL} # External URL
      - AI_RUNTIME_API=http://ai-runtime:8000
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
    env_file:
      - .env
    networks:
      - internal_network

  # Admin Console Frontend (Nginx) - Renamed from AiFirst
  admin-console-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-admin-console-ui
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_WEB_PORT}:80"
    volumes:
      - ./services/web/admin-console/frontend:/usr/share/nginx/html:ro
      - ./services/web/admin-console/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - TZ=${TZ:-UTC}
      - API_HOST=${ENV_PREFIX}-web-admin-console-api
      - APP_VERSION=${APP_VERSION}
    depends_on:
      - admin-console-api
    networks:
      - internal_network

  # Chat Web Renderer API (Bridge)
  chat-web-renderer-api:
    build:
      context: ./services/web/chat-web-renderer/backend
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-web-chat-web-renderer-api
    restart: unless-stopped
    ports:
      - "${REALTOR_BRIDGE_PORT}:8000"
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_DATABASE=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_USERNAME=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PASSWORD=${DB_PASS}
      - REDIS_URL=redis://redis:6379/0
      - AI_RUNTIME_API=http://ai-runtime:8000
      - AI_RUNTIME_API_PREFIX=/api/v1
      - AI_RUNTIME_RESET_URL=http://ai-runtime:8000/api/v1/internal/memory/reset
      - SCORING_CORE_RESET_URL=http://scoring-core:8000/api/v1/internal/memory/reset
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
      - ai-runtime
    networks:
      - internal_network

  # Chat Web Renderer Frontend (Nginx)
  chat-web-renderer-ui:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-chat-web-renderer-ui
    restart: unless-stopped
    ports:
      - "${REALTOR_WEB_PORT}:80"
    volumes:
      - ./services/web/chat-web-renderer/frontend:/usr/share/nginx/html:ro
      - ./services/web/chat-web-renderer/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - TZ=${TZ:-UTC}
      - API_HOST=chat-web-renderer-api
    depends_on:
      - chat-web-renderer-api
    networks:
      - internal_network

  # Corporate Website (Static)
  datasyncsa-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-corporate
    restart: unless-stopped
    ports:
      - "${CORPORATE_WEB_PORT}:80"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./services/web/datasyncsa:/usr/share/nginx/html:ro
    networks:
      - internal_network

  # Test UI (Development Only)
  test-ui:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-test-ui
    restart: unless-stopped
    ports:
      - "${TEST_UI_PORT}:80"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./services/web/tests:/usr/share/nginx/html:ro
    networks:
      - internal_network

# ---------------------------------------------------------------------------
# NETWORKS & VOLUMES
# ---------------------------------------------------------------------------
networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  portainer_data:
