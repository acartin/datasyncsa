version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE SERVICES
  # ---------------------------------------------------------------------------
  
  # Database (Replaces CT 101)
  postgres:
    build:
      context: ./services/database
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-infra-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network

  # Redis (Shared by Realtor Chat and ETL Queue)
  redis:
    image: redis:alpine
    container_name: ${ENV_PREFIX}-infra-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_network

  # ---------------------------------------------------------------------------
  # BACKEND SERVICES
  # ---------------------------------------------------------------------------



  # Inference Generic Core (Existing)
  inference-core:
    build:
      context: ./services/inference-stack/inference-core
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-inference
    restart: always
    ports:
      - "8083:8003"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_MODEL=${LLM_MODEL}
      - STORAGE_PATH=/app/data/storage
    volumes:
      - ${HOST_PATH_STORAGE}:/app/data/storage
      - ./schemas:/app/schemas:ro
    networks:
      - internal_network

  # Semantic Adapter (Existing)
  semantic-adapter:
    build:
      context: ./services/inference-stack/semantic-adapter
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-semantic
    restart: always
    ports:
      - "${SEMANTIC_PORT}:8000"
    env_file:
      - .env
    environment:
      - INFERENCE_CORE_URL=http://inference-core:8003
      - DATABASE_URL=${DATABASE_URL}
      - TABLE_VECTORS=${TABLE_VECTORS}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - inference-core
    networks:
      - internal_network

  # ETL Processor (Media Worker)
  etl-processor:
    build:
      context: ./services/etl-processor
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-backend-etl
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - PATH_STAGING=/app/data/staging
      - PATH_STORAGE=/app/data/storage
    volumes:
      - ${HOST_PATH_STAGING}:/app/data/staging
      - ${HOST_PATH_STORAGE}:/app/data/storage
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
    networks:
      - internal_network

  # ---------------------------------------------------------------------------
  # WEB SERVICES (Frontend + BFF)
  # ---------------------------------------------------------------------------

  # Admin Console API (BFF) - Renamed from AiFirst
  admin-console-api:
    build:
      context: ./services/web/admin-console/backend
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-web-admin-console-api
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_API_PORT}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - ETL_SERVICE_URL=${ETL_SERVICE_URL} # External URL
      - INFERENCE_CORE_URL=http://inference-core:8003
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
    networks:
      - internal_network

  # Admin Console Frontend (Nginx) - Renamed from AiFirst
  admin-console-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-admin-console-ui
    restart: unless-stopped
    ports:
      - "${ADMIN_CONSOLE_WEB_PORT}:80"
    volumes:
      - ./services/web/admin-console/frontend:/usr/share/nginx/html:ro
      - ./services/web/admin-console/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - API_HOST=${ENV_PREFIX}-web-admin-console-api
    depends_on:
      - admin-console-api
    networks:
      - internal_network

  # Realtor Chat API (Bridge)
  realtor-api:
    build:
      context: ./services/web/realtor-chat/backend
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX}-web-realtor-api
    restart: unless-stopped
    ports:
      - "${REALTOR_BRIDGE_PORT}:8000"
    environment:
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
      - INFERENCE_CORE_URL=http://inference-core:8003/api/v1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./schemas:/app/schemas:ro
    depends_on:
      - postgres
      - redis
      - inference-core
    networks:
      - internal_network

  # Realtor Chat Frontend (Nginx)
  realtor-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-realtor-ui
    restart: unless-stopped
    ports:
      - "${REALTOR_WEB_PORT}:80"
    networks:
      - internal_network

  # Corporate Website (Static)
  datasyncsa-web:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-corporate
    restart: unless-stopped
    ports:
      - "${CORPORATE_WEB_PORT}:80"
    volumes:
      - ./services/web/datasyncsa:/usr/share/nginx/html:ro
    networks:
      - internal_network

  # Test UI (Development Only)
  test-ui:
    image: nginx:alpine
    container_name: ${ENV_PREFIX}-web-test-ui
    restart: unless-stopped
    ports:
      - "${TEST_UI_PORT}:80"
    volumes:
      - ./services/web/tests:/usr/share/nginx/html:ro
    networks:
      - internal_network

# ---------------------------------------------------------------------------
# NETWORKS & VOLUMES
# ---------------------------------------------------------------------------
networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
